<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gbekor SHS LMS</title>
<style>
:root{--nav:#10243a;--nav2:#183957;--gold:#c69b3c;--bg:#f4f7fb;--text:#17212b;--white:#fff;--muted:#667085;--border:#dfe6ee;--green:#16803c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#10243a,#274c6b)}
.login-card{width:min(440px,100%);background:#fff;border-radius:20px;padding:32px;box-shadow:0 20px 50px #0005;text-align:center}.logo{width:100px;height:100px;object-fit:contain;border-radius:50%;background:#fff;margin:auto;display:block}
h1,h2,h3{margin-top:0}input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;margin:7px 0;font-size:15px}
button,.btn{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700;margin:3px;background:var(--gold);color:#fff;text-decoration:none;display:inline-block}.btn.light{background:#eaf0f6;color:#182638}.btn.green{background:var(--green)}.btn.danger{background:#b42318}
#app{display:none;min-height:100vh}.sidebar{position:fixed;left:0;top:0;width:255px;height:100vh;background:linear-gradient(180deg,var(--nav),#0a1826);color:#fff;padding:18px;overflow:auto}.brand{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid #ffffff22}.brand img{width:50px;height:50px;object-fit:contain;background:#fff;border-radius:50%}.brand strong{font-size:20px}.brand small{color:#d6bd81;letter-spacing:2px}
.nav-title{font-size:11px;color:#aab8c7;margin:20px 8px 7px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#dbe6f0;padding:12px;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff;border-left:4px solid var(--gold)}
.main{margin-left:255px;min-height:100vh}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3}.content{padding:28px;max-width:1400px;margin:auto}
.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.cols{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 2px 8px #10243a0b}.stat{font-size:32px;font-weight:bold;color:var(--nav)}.muted{color:var(--muted)}.badge{background:#e8f5eb;color:#146c32;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:bold}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border)}th{background:#f5f7fa}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
.lesson{margin:12px 0;padding:16px;border:1px solid var(--border);border-radius:10px;background:#fff}.option{display:block;padding:10px;border:1px solid var(--border);border-radius:8px;margin:7px 0}.notice{padding:12px;background:#fff8df;border-left:4px solid var(--gold);border-radius:8px}
@media(max-width:800px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0}.stats{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 14px}.content{padding:16px}}
</style>
</head>

['Networking',[['A LAN covers?','A small geographic area','The whole world','One continent',0],['A common LAN device is?','Switch','Monitor','Printer',0],['Central-device topology is?','Star','Bus','Ring',0],['WAN means?','Wide Area Network','Web Area Number','Wireless Access Node',0],['Internet is?','A network of networks','One computer','One website',0]]],
['Cybersecurity',[['Phishing tries to?','Steal sensitive information','Clean hardware','Print files',0],['A strong password should be?','Long and unique','Your name','Shared with friends',0],['Malware is?','Malicious software','A monitor','A cable',0],['MFA improves?','Account security','Typing speed','Screen size',0],['Backups help to?','Recover lost data','Change keyboard','Delete files',0]]],
['Spreadsheets',[['A formula begins with?','=','#','@',0],['Total function?','SUM','MAX','MIN',0],['A cell is?','Row and column intersection','A page','A folder',0],['Mean function?','AVERAGE','SUM','IF',0],['Charts help to?','Visualize data','Install software','Delete data',0]]],
['Programming',[['An algorithm is?','A step-by-step solution','A monitor','A cable',0],['A flowchart?','Visually represents steps','Stores passwords','Prints data',0],['A variable?','Stores a value','Deletes software','Connects network',0],['Python loop?','for','switch','select',0],['A function?','Groups reusable instructions','Increases screen size','Deletes files',0]]]];

let role='Student';
function login(){const u=document.getElementById('username').value.trim().toLowerCase(),p=document.getElementById('password').value.trim();if((u==='admin')&&(p==='admin')){role=document.getElementById('role').value;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('roleBadge').textContent=role;showPage('dashboard')}else document.getElementById('loginMsg').textContent='Use admin for username/email and admin for password.'}
function logout(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex'}
function showPage(page){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('#nav button').forEach(b=>{if(b.textContent.toLowerCase().includes(page==='lessons'?'lessons':page))b.classList.add('active')});
 document.getElementById('pageTitle').textContent=page.replace(/\b\w/g,c=>c.toUpperCase());
 const c=document.getElementById('content');
 const pages={
 dashboard:dashboard,courses:courses,lessons:lessonList,assignments:assignmentList,quizzes:quizList,scenario:scenario,gradebook:gradebook,certificates:certificates,calendar:calendarPage,students:studentList,teachers:teacherList,profile:profile,notifications:notifications
 }; c.innerHTML=(pages[page]||dashboard)();window.scrollTo(0,0);
}
function dashboard(){return `<h1>Dashboard</h1><p class="muted">Welcome to the Gbekor SHS Learning Management System.</p><div class="grid stats"><div class="card"><div class="stat">5</div>Active Courses</div><div class="card"><div class="stat">3</div>ICT Teachers</div><div class="card"><div class="stat">${assignments.length}</div>Assignments</div><div class="card"><div class="stat">${quizzes.length}</div>Quizzes</div><div class="card"><div class="stat">45</div>Students</div></div><br><div class="grid cols"><div class="card"><h2>Quick Actions</h2><button onclick="showPage('lessons')">Open ICT Notes</button><button onclick="showPage('assignments')">View Assignments</button><button onclick="showPage('quizzes')">Take a Quiz</button></div><div class="card"><h2>Announcements</h2><p class="notice">New ICT assignments and quizzes are available. Complete your learning activities before their due dates.</p></div></div>`}
function courses(){return `<h1>My Courses</h1><div class="grid cols">${['Introduction to ICT','Computer Networking','Cybersecurity','Database Management','Python Programming'].map((x,i)=>`<div class="card"><h2>${x}</h2><p class="muted">Course ${i+1} • ICT Department</p><button onclick="showPage('lessons')">Open Course</button></div>`).join('')}</div>`}
function lessonList(){return `<h1>ICT Notes and Lessons</h1><div class="grid cols">${notes.map((n,i)=>`<div class="card"><h2>${i+1}. ${n[0]}</h2><p>${n[1].slice(0,130)}...</p><button onclick="openNote(${i})">Open Note</button></div>`).join('')}</div>`}
function openNote(i){const n=notes[i];document.getElementById('content').innerHTML=`<div class="card"><h1>${n[0]}</h1><p>${n[1]}</p><h2>Key Learning Points</h2><ul><li>Understand the main concept.</li><li>Identify practical examples.</li><li>Apply the concept to real-life ICT situations.</li></ul><h2>Revision Questions</h2><ol><li>Define the topic in your own words.</li><li>Give two examples.</li><li>Explain one practical application.</li></ol><button onclick="showPage('lessons')">Back to ICT Notes</button></div>`}
function assignmentList(){return `<h1>Assignments</h1><div class="grid cols">${assignments.map((a,i)=>`<div class="card"><h2>${a[0]}</h2><p>${a[1]}</p><p><b>Level:</b> ${a[2]}</p><button onclick="openAssignment(${i})">Open Assignment</button></div>`).join('')}</div>`}
function openAssignment(i){const a=assignments[i];document.getElementById('content').innerHTML=`<div class="card"><h1>${a[0]}</h1><p>${a[1]}</p><p><b>Level:</b> ${a[2]}</p><h2>Submit Your Work</h2><input type="file" id="file"><button class="green" onclick="submitAssignment(${i})">Submit Assignment</button><p id="submissionMsg"></p><button class="light" onclick="showPage('assignments')">Back</button></div>`}
function submitAssignment(i){const f=document.getElementById('file').files[0];if(!f){document.getElementById('submissionMsg').textContent='Please choose a file first.';return}const x=JSON.parse(localStorage.getItem('submissions')||'[]');x.push({assignment:assignments[i][0],file:f.name,date:new Date().toLocaleString()});localStorage.setItem('submissions',JSON.stringify(x));document.getElementById('submissionMsg').innerHTML='<span class="badge">Submitted successfully: '+f.name+'</span>'}
function quizList(){return `<h1>Quizzes</h1><div class="grid cols">${quizzes.map((q,i)=>`<div class="card"><h2>${q[0]}</h2><p>${q[1].length} multiple-choice questions</p><button onclick="startQuiz(${i})">Start Quiz</button></div>`).join('')}</div>`}
function startQuiz(i){const q=quizzes[i];document.getElementById('content').innerHTML=`<h1>${q[0]}</h1>${q[1].map((x,j)=>`<div class="card"><h3>${j+1}. ${x[0]}</h3>${x.slice(1,4).map((o,k)=>`<label class="option"><input type="radio" name="q${j}" value="${k}"> ${o}</label>`).join('')}</div>`).join('')}<button onclick="markQuiz(${i})">Submit Quiz</button><button class="light" onclick="showPage('quizzes')">Cancel</button><div id="quizResult"></div>`}
function markQuiz(i){const q=quizzes[i];let score=0;q[1].forEach((x,j)=>{if(document.querySelector(`input[name="q${j}"]:checked`)?.value==x[4])score++});const pct=Math.round(score/q[1].length*100);const r=JSON.parse(localStorage.getItem('results')||'[]');r.push({quiz:q[0],score,pct,date:new Date().toLocaleString()});localStorage.setItem('results',JSON.stringify(r));document.getElementById('quizResult').innerHTML=`<div class="card"><h2>Result: ${score}/${q[1].length} (${pct}%)</h2><p>${pct>=50?'Well done. You passed!':'Review the notes and try again.'}</p></div>`}
function scenario(){return `<h1>Scenario Lab</h1><div class="card"><h2>Scenario: Phishing Email</h2><p>You receive an email asking you to click a link and enter your school password. What should you do?</p><button onclick="alert('Correct: Do not click the suspicious link. Verify the sender and report the message.')">Do not click; report it</button><button class="light" onclick="alert('Not recommended. Clicking unknown links can expose your account.')">Click the link immediately</button></div><div class="card"><h2>Scenario: Data Backup</h2><p>A computer containing important student records fails. What should have been done?</p><button onclick="alert('Correct: Maintain regular backups of important data.')">Keep regular backups</button></div>`}
function gradebook(){const r=JSON.parse(localStorage.getItem('results')||'[]');return `<h1>Gradebook</h1><div class="table-wrap"><table><tr><th>Quiz</th><th>Score</th><th>Percentage</th><th>Date</th></tr>${r.length?r.map(x=>`<tr><td>${x.quiz}</td><td>${x.score}</td><td>${x.pct}%</td><td>${x.date}</td></tr>`).join(''):'<tr><td colspan="4">No quiz results yet. Complete a quiz to see your grade.</td></tr>'}</table></div>`}
function certificates(){return `<h1>Certificates</h1><div class="card"><h2>ICT Course Certificate</h2><p>Complete all core lessons and pass at least three quizzes to qualify.</p><button onclick="alert('Certificate eligibility will be checked from your quiz results.')">Check Eligibility</button></div>`}
function calendarPage(){return `<h1>Calendar</h1><div class="grid cols"><div class="card"><h2>September 2026</h2><p>ICT Fundamentals Report – Due 10 September</p><p>Spreadsheet Practical – Due 22 September</p></div><div class="card"><h2>October 2026</h2><p>Networking Research – Due 1 October</p><p>Web Design Project – Due 20 October</p></div></div>`}
function studentList(){return `<h1>Student Directory</h1><div class="table-wrap"><table><tr><th>#</th><th>Name</th><th>ID</th><th>Class</th><th>Action</th></tr>${students.map((s,i)=>`<tr><td>${i+1}</td><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td><button onclick="openStudent(${i})">Open</button></td></tr>`).join('')}</table></div>`}
function openStudent(i){const s=students[i];document.getElementById('content').innerHTML=`<div class="card"><h1>Student Profile</h1><h2>${s[0]}</h2><p><b>Student ID:</b> ${s[1]}</p><p><b>Class:</b> ${s[2]}</p><p><span class="badge">Active Student</span></p><button onclick="showPage('students')">Back to Students</button></div>`}
function teacherList(){const t=[
['Dennis Kofi Adzabe','ICT / Computing','GBSHS/TCH/ICT/001'],
['Mr. Daniel Mensah','ICT / Computing','GBSHS/TCH/ICT/002'],
['Mrs. Patricia Asare','ICT / Computing','GBSHS/TCH/ICT/003']
];return `<h1>ICT Teachers</h1><p class="muted">The Gbekor SHS ICT Department has three active ICT teachers.</p><div class="grid cols">${t.map((x,i)=>`<div class="card"><h2>${x[0]}</h2><p><b>Subject:</b> ${x[1]}</p><p><b>Staff ID:</b> ${x[2]}</p><p><span class="badge">Active ICT Teacher</span></p><button onclick="openTeacher(${i})">Open Profile</button></div>`).join('')}</div>`}
function openTeacher(i){const t=[
['Dennis Kofi Adzabe','ICT / Computing','GBSHS/TCH/ICT/001'],
['Mr. Daniel Mensah','ICT / Computing','GBSHS/TCH/ICT/002'],
['Mrs. Patricia Asare','ICT / Computing','GBSHS/TCH/ICT/003']
][i];document.getElementById('content').innerHTML=`<div class="card"><h1>ICT Teacher Profile</h1><h2>${t[0]}</h2><p><b>Subject:</b> ${t[1]}</p><p><b>Staff ID:</b> ${t[2]}</p><p><span class="badge">Active ICT Teacher</span></p><button onclick="showPage('teachers')">Back to ICT Teachers</button></div>`}
function profile(){return `<h1>Profile</h1><div class="card"><h2>Portal Profile</h2><p><b>Role:</b> ${role}</p><input id="newName" placeholder="Create a display name"><button onclick="saveProfile()">Save Profile</button><p id="profileMsg"></p></div>`}
function saveProfile(){const n=document.getElementById('newName').value.trim();if(n){localStorage.setItem('displayName',n);document.getElementById('profileMsg').innerHTML='<span class="badge">Profile saved successfully.</span>'}}
function notifications(){return `<h1>Notifications</h1><div class="card"><p>📌 New ICT assignments have been added.</p><p>📝 Five quizzes are available for practice.</p><p>📚 Sixteen ICT notes are ready to open.</p></div>`}
</script>
</body>
</html>
