<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#681329">
  <title>Gbekor SHS Learning Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="auth-screen" class="auth-shell">
    <section class="auth-card">
      <img class="school-seal" src="school-logo.jpg" alt="Gbekor Senior High School logo">
      <h1>Gbekor SHS Learning Portal</h1>
      <p>Adaklu · Volta Region</p>
      <form id="sign-in-form">
        <label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@school.edu.gh">
        <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password">
        <button class="button gold" type="submit">Sign in</button>
      </form>
      <form id="set-password-form" class="hidden">
        <label for="new-password">Choose a new password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
        <label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat your password">
        <button class="button gold" type="submit">Save password</button>
      </form>
      <button id="forgot-password" class="link-button" type="button">Forgot password?</button>
      <p id="auth-message" class="message" aria-live="polite"></p>
      <p class="hint">Accounts are created and managed by the school administrator.</p>
    </section>
  </main>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><img src="school-logo.jpg" alt="Gbekor Senior High School logo"><div><b>Gbekor SHS</b><span>LEARNING PORTAL</span></div></div>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="account"><small id="role-label"></small><b id="account-name"></b><button id="sign-out" class="button light">Sign out</button></div>
    </aside>
    <section class="content">
      <header><div><h1 id="title">Dashboard</h1><p id="subtitle">Your learning overview</p></div><button id="refresh" class="button light">Refresh</button></header>
      <div id="notice" class="notice hidden" role="status"></div>
      <div id="view"></div>
    </section>
  </div>

  <template id="loading"><div class="card loading">Loading…</div></template>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
