<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gbekor SHS Learning Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Public+Sans:wght@400;500;600;700;800&display=swap');

  :root{
    --wine:#7A1128;
    --wine-deep:#520B1B;
    --gold:#C89B3C;
    --gold-soft:#EFDFB6;
    --parchment:#F7F1E4;
    --ink:#241A17;
    --muted:#7A6E60;
    --line:#E4D9C4;
    --card:#FFFDF8;
    --forest:#2F6B4F;
    --forest-bg:#E7F1EA;
    --amber:#96631A;
    --amber-bg:#FBF0DC;
    --rose:#9A2B3C;
    --rose-bg:#F8E7E5;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Public Sans',Arial,sans-serif;background:var(--parchment);color:var(--ink);}
  h1,h2,h3,.display{font-family:'Newsreader',Georgia,serif;}

  /* ---------- Ledger texture, the signature device ---------- */
  .ledger{
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 34px;
    background-position: 0 8px;
  }
  .ledger-margin{
    position:relative;
  }
  .ledger-margin::before{
    content:"";
    position:absolute;left:46px;top:0;bottom:0;width:1px;
    background:var(--rose);opacity:.35;
  }

  /* ---------- Top bar ---------- */
  .top{
    height:74px;background:var(--wine-deep);color:#fff;
    display:flex;align-items:center;padding:0 28px;gap:16px;
    position:sticky;top:0;z-index:20;
    box-shadow:0 2px 0 var(--gold);
  }
  .badge{
    width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #a3364f, var(--wine) 60%, var(--wine-deep));
    border:2px solid var(--gold);
    display:grid;place-items:center;
    font-family:'Newsreader',serif;font-weight:700;color:var(--gold-soft);font-size:16px;letter-spacing:.5px;
    flex-shrink:0;
  }
  .brand{line-height:1.25}
  .brand b{font-family:'Newsreader',serif;font-weight:700;font-size:16.5px;display:block;letter-spacing:.2px}
  .brand span{font-size:11px;letter-spacing:1.6px;color:var(--gold-soft);text-transform:uppercase;font-weight:600}
  .mode{margin-left:auto;display:flex;gap:6px;background:rgba(255,255,255,.08);padding:4px;border-radius:10px}
  .mode button{border:0;background:transparent;color:#f2e6e6;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
  .mode button.active{background:var(--gold);color:var(--wine-deep)}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:calc(100vh - 74px)}
  aside{
    width:230px;background:var(--card);border-right:1px solid var(--line);
    padding:22px 14px;position:sticky;top:74px;height:calc(100vh - 74px);
  }
  .role-tag{
    font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);
    padding:0 10px 12px;font-weight:700;
  }
  .nav{
    width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;
    border-radius:9px;margin:2px 0;cursor:pointer;color:var(--ink);font-family:inherit;
    font-size:14px;display:flex;align-items:center;gap:10px;font-weight:500;
  }
  .nav:hover{background:var(--gold-soft)}
  .nav.active{background:var(--wine);color:#fff;font-weight:700}
  .nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}

  main{flex:1;padding:30px 34px 60px;max-width:1180px}

  /* ---------- Hero / welcome ---------- */
  .welcome{
    background:linear-gradient(135deg,var(--wine),var(--wine-deep));
    color:#fdf6ee;border-radius:18px;padding:30px 32px;
    display:flex;justify-content:space-between;align-items:center;gap:24px;
    position:relative;overflow:hidden;
  }
  .welcome::after{
    content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;
    border:1px solid rgba(200,155,60,.35);border-radius:50%;
  }
  .welcome h1{margin:0 0 6px;font-size:27px;font-weight:600}
  .welcome p{margin:0 0 16px;color:#e9d9d9;font-size:14.5px;max-width:440px}
  .btn{border:0;border-radius:9px;padding:11px 17px;cursor:pointer;font-weight:700;font-family:inherit;font-size:13.5px}
  .btn.gold{background:var(--gold);color:var(--wine-deep)}
  .btn.outline{background:transparent;border:1.5px solid rgba(253,246,238,.55);color:#fdf6ee}
  .btn.wine{background:var(--wine);color:#fff}
  .stamp{
    font-family:'Newsreader',serif;font-size:64px;opacity:.16;font-weight:700;flex-shrink:0;
    border:2px solid rgba(253,246,238,.4);border-radius:50%;width:96px;height:96px;
    display:grid;place-items:center;line-height:1;
  }

  /* ---------- Grid stats ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .stat .label{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
  .stat strong{display:block;font-family:'Newsreader',serif;font-size:30px;color:var(--wine);margin:6px 0 2px;font-weight:700}
  .stat .sub{font-size:12.5px;color:var(--muted)}

  /* ---------- Two column ---------- */
  .cols{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
  .course-head{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .course-icon{width:52px;height:52px;border-radius:11px;background:var(--gold-soft);color:var(--wine);display:grid;place-items:center;font-size:22px;flex-shrink:0}
  .course-head h2{margin:0;font-size:19px;font-weight:600}
  .course-head .sub{font-size:12.5px;color:var(--muted)}
  .progress{height:9px;background:var(--line);border-radius:10px;overflow:hidden;margin:14px 0 6px}
  .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--wine),var(--gold))}

  .list{list-style:none;margin:12px 0 0;padding:0}
  .list li{padding:11px 2px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13.5px;gap:10px}
  .list li:last-child{border-bottom:0}
  .pill{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill.ok{background:var(--forest-bg);color:var(--forest)}
  .pill.pending{background:var(--amber-bg);color:var(--amber)}
  .pill.risk{background:var(--rose-bg);color:var(--rose)}

  .section-title{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px}
  .section-title h2{margin:0;font-size:19px;font-weight:600}
  .section-title .sub{font-size:12.5px;color:var(--muted)}

  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  tr:last-child td{border-bottom:0}

  /* ---------- Login (ledger cover) ---------- */
  .login-wrap{min-height:100vh;background:var(--wine-deep);display:grid;place-items:center;padding:20px}
  .book{
    width:420px;max-width:100%;background:var(--parchment);border-radius:4px 14px 14px 4px;
    box-shadow:0 25px 60px rgba(0,0,0,.35), -6px 0 0 var(--wine), -10px 0 0 var(--wine-deep);
    padding:40px 36px 34px;position:relative;
  }
  .book .badge{width:64px;height:64px;font-size:21px;margin:0 auto 16px}
  .book h1{text-align:center;margin:0 0 4px;font-size:22px;color:var(--wine-deep);font-weight:700}
  .book .tag{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:26px;font-weight:600}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;margin-bottom:5px}
  .field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:inherit;font-size:14px}
  .field input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
  .book .btn{width:100%;margin-top:8px;padding:13px}
  .book .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}

  .hidden{display:none !important}

  @media(max-width:920px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .cols{grid-template-columns:1fr}
  }
  @media(max-width:680px){
    aside{display:none}
    main{padding:18px}
    .welcome{flex-direction:column;align-items:flex-start;padding:22px}
    .stamp{display:none}
    .top{padding:0 16px}
    .brand b{font-size:14.5px}
  }

  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- Quiz engine ---------- */
  .quiz-list .card{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:14px}
  .quiz-list h3{margin:0 0 4px;font-size:15.5px}
  .quiz-list .sub{margin:0;font-size:12.5px;color:var(--muted)}
  .q-block{padding:18px 0;border-bottom:1px dashed var(--line)}
  .q-block:last-of-type{border-bottom:0}
  .q-block .q-text{font-weight:600;margin:0 0 10px;font-size:14.5px}
  .q-opt{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.8px;margin-bottom:4px}
  .q-opt:hover{background:var(--gold-soft)}
  .q-opt input{margin-top:3px}
  .q-opt.correct{background:var(--forest-bg);color:var(--forest);font-weight:600}
  .q-opt.wrong{background:var(--rose-bg);color:var(--rose);font-weight:600}
  .score-ring{
    width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;
    background:conic-gradient(var(--wine) var(--pct,0%), var(--line) 0);
  }
  .score-ring span{
    width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;
    font-family:'Newsreader',serif;font-weight:700;font-size:19px;color:var(--wine);
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
let role = "student";
let active = "Dashboard";
let quizView = "list";      // list | take | result
let currentQuizId = null;
let currentAnswers = {};
let lastResult = null;

const QUIZ_BANK = [
  { id:"wp-knowledge", course:"Word Processing Essentials", title:"Knowledge Quiz",
    questions:[
      { q:"Which file extension is used for a Word document by default?", options:["ppgotx",".docx",".xlsx",".pdf"], correct:1 },
      { q:"What is the fastest way to save a document you're working on?", options:["Close the window","Ctrl + S","Print it","Restart the computer"], correct:1 },
      { q:"To make text stand out with heavier strokes, you apply:", options:["Italic","Underline","Bold","Strikethrough"], correct:2 },
      { q:"Which feature arranges data into rows and columns inside a document?", options:["Table","Footer","Header","Bullet list"], correct:0 },
      { q:"Before printing a document, it's best practice to first:", options:["Delete the file","Preview the layout","Turn off the printer","Rename the document"], correct:1 }
    ]},
  { id:"wp-saving", course:"Word Processing Essentials", title:"Saving Quiz",
    questions:[
      { q:"'Save As' is mainly used to:", options:["Delete a file","Create a copy under a new name or location","Print a file","Close a file"], correct:1 },
      { q:"Which of these is a safe habit when working on a school assignment?", options:["Never saving until you finish","Saving regularly as you work","Only saving on submission day","Saving only on the teacher's computer"], correct:1 }
    ]},
  { id:"wp-table-print", course:"Word Processing Essentials", title:"Table & Printing Quiz",
    questions:[
      { q:"To insert a table in Word, you use:", options:["Home tab → Font","Insert tab → Table","View tab → Zoom","Review tab → Spelling"], correct:1 },
      { q:"If no printer is available, the best alternative before submitting is to:", options:["Skip printing entirely","Export/Save as PDF","Retype the document by hand","Wait until the next lesson"], correct:1 },
      { q:"Before printing, you should always:", options:["Turn off the computer","Confirm the correct number of copies/pages","Delete the file","Change the font colour"], correct:1 }
    ]}
];

let RECORDS = [];
let scenarioChoice = null;

function loadRecords(){
  return RECORDS;
}
function saveRecordEntry(rec){
  RECORDS.unshift(rec);
}

const studentNav = ["Dashboard","My Courses","Assignments","Quizzes","Scenario","Grades","Certificates","Calendar","Notifications"];
const teacherNav  = ["Dashboard","Students","Courses","Gradebook","Attendance","Completion","Reports","Certificates"];

function initials(){ return "GSHS"; }

function login(){
  document.getElementById("app").innerHTML = `
  <div class="login-wrap">
    <div class="book">
      <div class="badge">${initials()}</div>
      <h1>Gbekor SHS Learning Portal</h1>
      <div class="tag">Adaklu &middot; Volta Region</div>
      <div class="field"><label>Username</label><input placeholder="e.g. student.id or staff.id"></div>
      <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
      <button class="btn gold" onclick="showPortal()">Sign in</button>
      <div class="foot">Student and Teacher accounts are managed centrally.<br>Trouble signing in? See your ICT/Computing teacher.</div>
    </div>
  </div>`;
}

function showPortal(){ active = "Dashboard"; render(); }

function pretend(item){
  alert(item + " — this is a portal prototype screen. The live version opens the real activity here.");
}

function switchRole(r){ role = r; active = "Dashboard"; quizView="list"; scenarioChoice=null; render(); }

function openQuiz(id){ currentQuizId = id; currentAnswers = {}; quizView = "take"; active = "Quizzes"; render(); }
function backToQuizList(){ quizView = "list"; active = "Quizzes"; render(); }
function pickAnswer(qIndex, optIndex){ currentAnswers[qIndex] = optIndex; render(); }

function submitQuiz(){
  const quiz = QUIZ_BANK.find(x => x.id === currentQuizId);
  let correctCount = 0;
  quiz.questions.forEach((q,i) => { if(currentAnswers[i] === q.correct) correctCount++; });
  const pct = Math.round((correctCount / quiz.questions.length) * 100);
  lastResult = { quizId: quiz.id, title: quiz.title, course: quiz.course, correctCount, total: quiz.questions.length, pct };
  saveRecordEntry({
    type:"quiz", title: quiz.title, course: quiz.course, score: pct,
    date: new Date().toISOString().slice(0,10)
  });
  quizView = "result";
  render();
}

function navHTML(items){
  return items.map(x => `
    <button class="nav ${x===active?'active':''}" onclick="active='${x}';render()">
      <span class="dot"></span>${x}
    </button>`).join("");
}

function render(){
  const student = role === "student";
  const shellNav = student ? studentNav : teacherNav;
  document.getElementById("app").innerHTML = `
    <div class="top">
      <div class="badge">${initials()}</div>
      <div class="brand">
        <b>Gbekor Senior High School</b>
        <span>ICT / Computing &middot; Learning Portal</span>
      </div>
      <div class="mode">
        <button class="${student?'active':''}" onclick="switchRole('student')">Student</button>
        <button class="${!student?'active':''}" onclick="switchRole('teacher')">Teacher</button>
      </div>
    </div>
    <div class="shell">
      <aside>
        <div class="role-tag">${student?'Student Portal':'Teacher Portal'}</div>
        ${navHTML(shellNav)}
      </aside>
      <main>${ mainContent(student) }</main>
    </div>`;
}

function mainContent(student){
  if(active === "Dashboard") return student ? studentDash() : teacherDash();
  if(active === "Quizzes" && student){
    if(quizView === "take") return quizTakeScreen();
    if(quizView === "result") return quizResultScreen();
    return quizListScreen();
  }
  if(active === "Scenario" && student) return scenarioScreen();
  return placeholder(active);
}

function pickScenario(letter){ scenarioChoice = letter; render(); }
function resetScenario(){ scenarioChoice = null; render(); }

function scenarioScreen(){
  const outcomes = {
    A: { verdict:"RISKY", pill:"risk", text:"Ama spends so long perfecting formatting that she runs out of time to save — and loses all her unsaved work. Formatting before saving is one of the most common mistakes students make." },
    C: { verdict:"INCOMPLETE", pill:"pending", text:"Ama prints an unformatted document. It may be readable, but it won't meet the assessment requirements, and \"next time\" rarely comes during a timed practical." },
    B: { verdict:"CORRECT", pill:"ok", text:"Save first, always. A saved-but-unformatted document can still be improved with remaining time. An unsaved document, however well formatted, can be lost completely." }
  };
  return `
    <div class="section-title"><h2>Scenario: Ama's Assignment</h2><span class="sub">Apply all four skills together</span></div>
    <div class="card ledger" style="padding:24px 28px">
      <p style="font-size:14.5px;line-height:1.6">
        Ama has typed her assignment, but it's unformatted, unsaved, and she's almost out of time
        before the period ends. <b>What should Ama do first?</b>
      </p>
      ${!scenarioChoice ? `
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
          <button class="btn outline" style="color:var(--wine);border-color:var(--line);text-align:left" onclick="pickScenario('A')">A — Try to fix the formatting perfectly before saving anything.</button>
          <button class="btn outline" style="color:var(--wine);border-color:var(--line);text-align:left" onclick="pickScenario('B')">B — Save the file immediately with a proper name, then format what time allows.</button>
          <button class="btn outline" style="color:var(--wine);border-color:var(--line);text-align:left" onclick="pickScenario('C')">C — Print the document as-is and format it "next time."</button>
        </div>` : `
        <div style="margin-top:18px;padding:16px 18px;border-radius:10px;background:${scenarioChoice==='B'?'var(--forest-bg)':scenarioChoice==='C'?'var(--amber-bg)':'var(--rose-bg)'}">
          <span class="pill ${outcomes[scenarioChoice].pill}">Option ${scenarioChoice} — ${outcomes[scenarioChoice].verdict}</span>
          <p style="margin:10px 0 0;font-size:14px;line-height:1.6">${outcomes[scenarioChoice].text}</p>
        </div>
        <p class="sub" style="margin-top:16px"><b>Remember:</b> save first, format second. Saving protects your work no matter what happens next.</p>
        <button class="btn wine" style="margin-top:6px" onclick="resetScenario()">Try another option</button>
      `}
    </div>`;
}

function quizListScreen(){
  const recs = loadRecords().filter(r => r.type === "quiz");
  return `
    <div class="section-title"><h2>Quizzes</h2><span class="sub">Word Processing Essentials</span></div>
    <div class="quiz-list">
      ${QUIZ_BANK.map(q => {
        const attempts = recs.filter(r => r.title === q.title);
        const best = attempts.length ? Math.max(...attempts.map(a=>a.score)) : null;
        return `
        <div class="card">
          <div>
            <h3>${q.title}</h3>
            <p class="sub">${q.questions.length} questions ${best!==null ? `&middot; best score <b style="color:var(--wine)">${best}%</b>` : '&middot; not attempted yet'}</p>
          </div>
          <button class="btn wine" onclick="openQuiz('${q.id}')">${best!==null?'Retake':'Start'}</button>
        </div>`;
      }).join("")}
    </div>

    <div class="section-title"><h2>Your quiz record</h2><span class="sub">Saved for this session</span></div>
    <div class="card ledger" style="padding:6px 20px">
      ${recs.length ? `
      <table>
        <tr><th>Quiz</th><th>Date</th><th>Score</th></tr>
        ${recs.map(r => `<tr><td>${r.title}</td><td>${r.date}</td><td>${r.score}%</td></tr>`).join("")}
      </table>` : `<p class="sub" style="padding:16px 0">No attempts recorded yet — take a quiz above and it will appear here.</p>`}
    </div>`;
}

function quizTakeScreen(){
  const quiz = QUIZ_BANK.find(x => x.id === currentQuizId);
  const answeredAll = quiz.questions.every((_,i) => currentAnswers[i] !== undefined);
  return `
    <div class="section-title"><h2>${quiz.title}</h2><span class="sub">${quiz.course}</span></div>
    <div class="card ledger" style="padding:6px 26px">
      ${quiz.questions.map((q,i) => `
        <div class="q-block">
          <p class="q-text">${i+1}. ${q.q}</p>
          ${q.options.map((opt,j) => `
            <label class="q-opt">
              <input type="radio" name="q${i}" ${currentAnswers[i]===j?'checked':''} onclick="pickAnswer(${i},${j})">
              <span>${opt}</span>
            </label>`).join("")}
        </div>`).join("")}
      <div style="padding:18px 0 4px;display:flex;gap:10px;align-items:center">
        <button class="btn wine" ${answeredAll?'':'disabled style="opacity:.5;cursor:not-allowed"'} onclick="submitQuiz()">Submit answers</button>
        <button class="btn outline" style="color:var(--wine);border-color:var(--line)" onclick="backToQuizList()">Cancel</button>
        ${!answeredAll ? `<span class="sub">Answer all questions to submit</span>` : ``}
      </div>
    </div>`;
}

function quizResultScreen(){
  const r = lastResult;
  return `
    <div class="section-title"><h2>${r.title} — result</h2><span class="sub">${r.course}</span></div>
    <div class="card" style="text-align:center;padding:32px 20px 26px;max-width:420px">
      <div class="score-ring" style="--pct:${r.pct}%"><span>${r.pct}%</span></div>
      <p style="margin:0 0 4px;font-weight:700">${r.correctCount} of ${r.total} correct</p>
      <p class="sub" style="margin:0 0 20px">Saved to your record just now.</p>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn wine" onclick="backToQuizList()">Back to quizzes</button>
        <button class="btn outline" style="color:var(--wine);border-color:var(--line)" onclick="active='Dashboard';quizView='list';render()">Go to dashboard</button>
      </div>
    </div>`;
}

function placeholder(name){
  return `
    <div class="section-title"><h2>${name}</h2><span class="sub">Prototype screen</span></div>
    <div class="card ledger" style="min-height:280px;padding:26px 30px">
      <p style="color:var(--muted);font-size:14px;max-width:480px">
        This is where <b>${name}</b> lives in the live portal. In this prototype it's a placeholder —
        wire it up to your real course, gradebook, or reporting data when the portal goes live.
      </p>
    </div>`;
}

function studentDash(){
  const recs = loadRecords().filter(r => r.type === "quiz");
  const quizAvg = recs.length ? Math.round(recs.reduce((s,r)=>s+r.score,0)/recs.length) : null;
